name: Phoenix
options:
  bundleIdPrefix: com.phoenix
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Secrets.xcconfig (gitignored) may define PHOENIX_LLM_API_KEY /
    # PHOENIX_LLM_ENDPOINT. It is optional: without it the app runs in offline
    # echo mode. A committed placeholder keeps the include from breaking the
    # build when no secrets file is present.
    GENERATE_INFOPLIST_FILE: NO

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

targets:
  Phoenix:
    type: application
    platform: iOS
    sources:
      - path: Phoenix
    info:
      path: Phoenix/Info.plist
      properties:
        CFBundleDisplayName: Phoenix
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Keep BLE alive in the background so the assistant transport can
        # reconnect without the app foregrounded.
        UIBackgroundModes:
          - bluetooth-central
        NSBluetoothAlwaysUsageDescription: >-
          Phoenix connects to your glasses over Bluetooth to send assistant
          replies and navigation.
        NSMicrophoneUsageDescription: >-
          Phoenix uses the microphone to capture your voice for the assistant.
        NSSpeechRecognitionUsageDescription: >-
          Phoenix transcribes your speech to answer questions on the glasses.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phoenix.app
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES

  PhoenixTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PhoenixTests
    dependencies:
      - target: Phoenix
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phoenix.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Phoenix:
    build:
      targets:
        Phoenix: all
        PhoenixTests: [test]
    test:
      targets:
        - PhoenixTests
      gatherCoverageData: false
    run:
      config: Debug
